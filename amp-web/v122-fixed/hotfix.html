<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMP Marketing V12.2 Hotfix</title><style>body{font-family:Segoe UI,Arial,sans-serif;background:#f3f5f7;color:#182126;padding:32px}.box{max-width:520px;margin:10vh auto;background:#fff;border:1px solid #d9e0e5;border-radius:14px;padding:22px}.muted{color:#72808b;font-size:13px}</style></head><body><div class="box"><h2>AMP Marketing</h2><div class="muted" id="st">Загружаю проверенную сборку…</div></div><script>(async()=>{try{const files=["hotfix-00.part.txt","hotfix-01.part.txt","hotfix-02.part.txt","hotfix-03.part.txt","hotfix-04.part.txt","hotfix-05.part.txt","hotfix-06.part.txt","hotfix-07.part.txt","hotfix-08.part.txt","hotfix-09.part.txt","hotfix-10.part.txt","hotfix-11.part.txt"];const chunks=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(f+' HTTP '+r.status);return r.text()}));const app=chunks.join('');document.open();document.write(app);document.close()}catch(e){document.getElementById('st').textContent='Ошибка загрузки: '+(e.message||e)}})();</script></body></html>
