<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Календарь — сканер V14.5</title><style>html,body{margin:0;min-height:100%;background:#07111f;color:#fff;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.box{min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{max-width:420px;text-align:center}.spin{width:32px;height:32px;border:3px solid #29415f;border-top-color:#52a8e8;border-radius:50%;margin:0 auto 16px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#9fb2ca}</style></head><body><div class="box"><div class="card"><div class="spin"></div><b>Загрузка сканера…</b><br><small>V14.5 · ДАТЫ</small></div></div><script>(async()=>{try{let b='';for(let i=1;i<=7;i++){const r=await fetch(`p${i}.txt?v=141full2`,{cache:'no-store'});if(!r.ok)throw new Error(`p${i}: HTTP ${r.status}`);b+=(await r.text()).trim()}const bin=Uint8Array.from(atob(b),c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('Браузер не поддерживает распаковку gzip');const ds=new DecompressionStream('gzip');let html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();html=html.replace("const VERSION='14.1'","const VERSION='14.5'").replaceAll('V14.1 FRAMEFIX','V14.5 · ДАТЫ');const p1='<scr'+'ipt src="patch142.js?v=143clean1"></scr'+'ipt>';const p2='<scr'+'ipt src="patch144.js?v=144white1"></scr'+'ipt>';const p3='<scr'+'ipt src="patch145.js?v=145dates1"></scr'+'ipt>';html=html.replace('</body>',p1+p2+p3+'</body>');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML=`<div class="box"><div class="card"><b>Не удалось загрузить сканер</b><p>${String(e)}</p><button onclick="location.reload()" style="padding:12px 18px;border:0;border-radius:12px">Повторить</button></div></div>`}})();</script></body></html>
