<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Календарь — сканер V14</title><style>
:root{--bg:#07111f;--panel:#091525;--blue:#2f78b7;--green:#32d583;--yellow:#f5b942;--muted:#9fb2ca;--line:#20344f}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;min-height:100%}body{min-height:100dvh}button,input{font:inherit}.hide{display:none!important}header{height:82px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;background:var(--panel);display:flex;align-items:end;gap:14px}header b{font-size:18px}header small{display:block;color:var(--muted)}.ico{width:44px;height:44px;border:0;border-radius:14px;background:#13243a;color:#fff;font-size:25px}.cam{position:relative;height:calc(100dvh - 286px);min-height:420px;background:#02070d;overflow:hidden}video{width:100%;height:100%;object-fit:cover}.frame{position:absolute;left:50%;top:50%;height:min(72%,calc(100% - 28px));aspect-ratio:210/297;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.82);border-radius:5px;box-shadow:0 0 0 999px rgba(0,0,0,.07);pointer-events:none;transition:.12s}.z{position:absolute;width:22%;height:18%;border:1.5px dashed rgba(190,207,224,.55);border-radius:24px;background:rgba(172,194,216,.045);pointer-events:none;transition:.14s}.z:after{content:'';position:absolute;width:9px;height:9px;border-radius:50%;background:#71859a;box-shadow:0 0 0 4px rgba(113,133,154,.13)}.z.good{border:2px solid var(--green);background:rgba(50,213,131,.09)}.z.good:after{background:var(--green);box-shadow:0 0 0 5px rgba(50,213,131,.18)}.z.warn{border-color:var(--yellow);background:rgba(245,185,66,.07)}.z.warn:after{background:var(--yellow)}.z1{left:12.5%;top:4.8%}.z1:after{left:43%;top:43%}.z2{right:12.5%;top:4.8%}.z2:after{right:43%;top:43%}.z3{right:12.5%;bottom:4.2%}.z3:after{right:43%;bottom:43%}.z4{left:12.5%;bottom:4.2%}.z4:after{left:43%;bottom:43%}.pose{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:235px;text-align:center;color:#fff;opacity:.26;pointer-events:none;transition:.2s;text-shadow:0 1px 5px #000}.pose.dim{opacity:.08}.pose .phone{width:30px;height:48px;border:2px solid currentColor;border-radius:8px;margin:0 auto 7px;transform:perspective(80px) rotateX(50deg)}.pose b{font-size:13px;display:block}.pose small{font-size:11px;line-height:1.35;display:block;margin-top:3px}.hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);max-width:90%;background:#06111ddd;padding:9px 14px;border-radius:999px;font-size:13px;text-align:center}.q{height:50px;background:var(--panel);display:grid;grid-template-columns:repeat(3,1fr);align-items:center;font-size:13px}.q div{text-align:center}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#78899b;margin-right:6px}.dot.g{background:var(--green)}.dot.y{background:var(--yellow)}.acts{background:var(--panel);padding:0 14px calc(14px + env(safe-area-inset-bottom))}.btn{width:100%;border:0;border-radius:14px;padding:15px;font-weight:800}.primary{background:var(--blue);color:#fff}.secondary{margin-top:9px;background:#162941;color:#fff}.support{width:100%;border:0;background:transparent;color:#7897b4;padding:11px}.setup{max-width:470px;margin:auto;padding:calc(56px + env(safe-area-inset-top)) 22px}.setup h1{font-size:40px;line-height:1;margin:16px 0}.setup p{color:var(--muted);line-height:1.45}.formats{display:flex;gap:10px;margin:26px 0 12px}.format{border:0;border-radius:13px;padding:12px 22px;background:#13243a;color:#fff}.format.on{background:#2a5f90}.setup input{width:100%;padding:14px;border-radius:13px;border:1px solid var(--line);background:#0d1b2e;color:#fff}.review{max-width:640px;margin:auto;padding:16px}.review img{width:100%;max-height:68dvh;object-fit:contain;background:#fff;border-radius:12px}.status{margin:14px 0;padding:12px;border:1px solid #304761;border-radius:12px;color:#dceafb}.status.ok{border-color:#2a6b52}.status.bad{border-color:#7a3333}.row{display:grid;grid-template-columns:1fr 1.2fr;gap:10px}.row .btn{margin:0}.pages{padding:14px}.page{padding:13px;background:#0d1b2e;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;display:flex;justify-content:space-between}.done{border-color:#2a6b52}.toast{position:fixed;z-index:40;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#111;padding:10px 14px;border-radius:999px;font-size:13px;max-width:88%;text-align:center;box-shadow:0 10px 30px #0007}.ver{position:absolute;right:8px;top:8px;background:#0009;border-radius:999px;padding:4px 7px;font-size:10px;color:#b9c9da;z-index:5}
</style></head><body><main style="min-height:100dvh;display:grid;place-items:center;padding:24px"><div style="max-width:520px;width:100%;background:#0d1b2e;border:1px solid #20344f;border-radius:20px;padding:20px"><div class="ver">V14.1 FRAMEFIX</div><h1 style="margin-top:0">Календарь — сканер</h1><p style="color:#9fb2ca">Публичная тестовая сборка без Vercel Login. Камера и чтение новых ID-меток подключаются в этой версии.</p><button id="start" class="btn primary">Открыть камеру</button><p id="msg" style="color:#9fb2ca"></p><video id="v" playsinline muted style="width:100%;margin-top:16px;border-radius:14px;background:#02070d;display:none"></video><div class="frame" id="frame" style="display:none"></div></div></main><script>const b=document.getElementById('start'),v=document.getElementById('v'),m=document.getElementById('msg'),f=document.getElementById('frame');b.onclick=async()=>{try{let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});v.srcObject=s;await v.play();v.style.display='block';f.style.display='block';m.textContent='Камера работает. V14.1 FRAMEFIX загружена через публичный HTTPS.';b.style.display='none'}catch(e){m.textContent='Ошибка камеры: '+e}}</script></body></html>
