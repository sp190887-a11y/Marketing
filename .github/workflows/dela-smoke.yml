name: Dela live smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'dela/**'
      - '.github/workflows/dela-smoke.yml'

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages and verify live app
        shell: bash
        run: |
          set -euo pipefail
          base='https://sp190887-a11y.github.io/Marketing/dela'
          for i in $(seq 1 18); do
            if curl -fsSL --max-time 20 "$base/" -o /tmp/dela-index.html; then
              if grep -q '<title>Дела</title>' /tmp/dela-index.html && grep -q 'id="auth"' /tmp/dela-index.html && grep -q 'ungkyimakkejsdsgkglz.supabase.co' /tmp/dela-index.html && grep -q 'id="pickfile"' /tmp/dela-index.html && grep -q 'Файл не загрузился (' /tmp/dela-index.html; then
                break
              fi
            fi
            if [ "$i" = 18 ]; then
              echo 'Live Dela index did not become valid in time' >&2
              exit 1
            fi
            sleep 5
          done
          python3 - <<'PY'
          import re
          h=open('/tmp/dela-index.html',encoding='utf-8').read()
          m=re.search(r'<script>(.*)</script>',h,re.S)
          assert m, 'inline script missing'
          open('/tmp/dela-app.js','w',encoding='utf-8').write(m.group(1))
          PY
          node --check /tmp/dela-app.js
          curl -fsSL --max-time 20 "$base/manifest.webmanifest" -o /tmp/manifest.json
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/manifest.json'))
          assert m['name']=='Дела'
          assert m['display']=='standalone'
          sizes={x['sizes'] for x in m.get('icons',[])}
          assert {'192x192','512x512'} <= sizes
          PY
          curl -fsSL --max-time 20 "$base/sw.js" -o /tmp/sw.js
          grep -q "const C='dela-v2'" /tmp/sw.js
          curl -fsSI --max-time 20 "$base/icon-192.png" | grep -qi '^content-type: image/png'
          curl -fsSI --max-time 20 "$base/icon-512.png" | grep -qi '^content-type: image/png'
          echo 'LIVE_DELA_SMOKE=PASS'
