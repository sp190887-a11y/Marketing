name: Apply Dela local build

on:
  push:
    paths:
      - '.github/workflows/dela-local-apply.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build and validate local Dela
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dela
          printf '%s' '' | base64 -d | gzip -d > dela/index.html
          printf '%s' '' | base64 -d | gzip -d > dela/sw.js
          printf '%s' '' | base64 -d | gzip -d > .github/workflows/dela-smoke.yml
          rm .github/workflows/dela-local-apply.yml
          grep -q 'indexedDB.open' dela/index.html
          grep -q '>Сохранить<' dela/index.html
          grep -q 'id="completeMenu"' dela/index.html
          grep -q 'id="deleteMenu"' dela/index.html
          grep -q 'restoreauto' dela/index.html
          ! grep -q 'supabase.co' dela/index.html
          python3 - <<'PY'
          import re, pathlib, subprocess
          s=pathlib.Path('dela/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m
          pathlib.Path('/tmp/dela.js').write_text(m.group(1),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/dela.js'],check=True)
          print('LOCAL_BUILD_VALIDATE=PASS')
          PY
      - name: Commit local Dela
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dela/index.html dela/sw.js .github/workflows/dela-smoke.yml .github/workflows/dela-local-apply.yml
          git diff --cached --check
          git commit -m 'Switch Dela to local-first iPhone storage'
          git push origin HEAD:main
