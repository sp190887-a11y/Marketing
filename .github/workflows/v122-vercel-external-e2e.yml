name: AMP Marketing V12.2 Vercel external E2E

on:
  push:
    paths:
      - .github/workflows/v122-vercel-external-e2e.yml
  workflow_dispatch:

jobs:
  external-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Vercel deployment
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://amp-marketing-v122-test-5vwfxmeym-67unicorndine-4818.vercel.app'
          code=$(curl -LsS -D /tmp/root.headers -o /tmp/root.html -w '%{http_code}' "$BASE/")
          echo "ROOT HTTP=$code"
          cat /tmp/root.headers
          echo '--- ROOT BODY ---'
          head -c 1200 /tmp/root.html; echo
          ecode=$(curl -LsS -D /tmp/e2e.headers -o /tmp/e2e.body -w '%{http_code}' "$BASE/api/e2e")
          echo "E2E HTTP=$ecode"
          cat /tmp/e2e.headers
          echo '--- E2E BODY ---'
          head -c 4000 /tmp/e2e.body; echo
          test "$code" = '200'
          grep -q 'AMP Marketing' /tmp/root.html
          grep -q 'V12.2' /tmp/root.html
          grep -q 'TEST' /tmp/root.html
          test "$ecode" = '200'
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/e2e.body'))
          assert j.get('ok') is True, j
          checks={x['name']:x for x in j.get('checks',[])}
          required=['health','state_get','save_1','save_2','conflict','file_put','file_get','public_schema_blocked']
          missing=[x for x in required if not checks.get(x,{}).get('ok')]
          assert not missing, (missing,j)
          print('NETWORK E2E PASS', required)
          PY
