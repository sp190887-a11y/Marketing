name: AM Club Server CI

on:
  push:
    branches:
      - amp-club-server-v1-final
    paths:
      - 'amp-club-backend/**'
      - '.github/workflows/amp-club-server-ci.yml'
  pull_request:
    paths:
      - 'amp-club-backend/**'
      - '.github/workflows/amp-club-server-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ampclub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ampclub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ampclub_test
      SMS_MODE: test
      OTP_PEPPER: ci-test-pepper
      ADMIN_BOOTSTRAP_TOKEN: ci-bootstrap-token
      ALLOWED_ORIGINS: https://club.amplituda-nn.ru,https://sp190887-a11y.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: amp-club-backend/requirements.txt
      - name: Install dependencies
        run: pip install -r amp-club-backend/requirements.txt
      - name: Python syntax
        run: python -m py_compile amp-club-backend/api/index.py
      - name: PostgreSQL end-to-end tests
        working-directory: amp-club-backend
        run: pytest -q
