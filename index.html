<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2f2ef"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Дела"><link rel="manifest" href="manifest.webmanifest"><title>Дела</title><style>html,body{margin:0;min-height:100%;background:#f2f2ef;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.x{padding:24px;font-size:18px}</style></head><body><div class="x">Загружаю «Дела»…</div><script>(async()=>{try{const b64=(await (await fetch('./payload.txt?3')).text()).trim();const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const text=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(text);document.close()}catch(e){document.body.innerHTML='<div class="x">Ошибка запуска: '+String(e)+'</div>'}})();if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
